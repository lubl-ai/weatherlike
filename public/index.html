<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeatherLike · 나에게 맞는 여행지 찾기</title>
  <meta name="description" content="내 정보를 입력하면 어울리는 여행지, 현재 날씨, 예상 항공권 가격을 추천해드립니다." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤️</text></svg>" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1>🌤️ WeatherLike</h1>
      <p class="tagline">내 취향 · 예산을 입력하면 <strong>어울리는 여행지</strong>와 <strong>현재 날씨</strong>, <strong>예상 항공권</strong>을 한 번에.</p>
    </div>
  </header>

  <main class="container">
    <form id="travel-form" class="card form">
      <div class="field">
        <label for="originCity">출발 도시</label>
        <input type="text" id="originCity" name="originCity" placeholder="예: 서울, 부산, Tokyo" value="서울" autocomplete="off" />
        <small>항공권 거리 계산에 사용돼요. 비워두면 서울 기준으로 계산합니다.</small>
      </div>

      <div class="field">
        <label>여행 취향 <span class="hint">(복수 선택)</span></label>
        <div id="interests" class="chips"><!-- JS로 채움 --></div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="budget">예산 성향</label>
          <select id="budget" name="budget">
            <option value="low">💸 가성비 (저예산)</option>
            <option value="mid" selected>💳 보통</option>
            <option value="high">💎 여유 (고예산)</option>
          </select>
        </div>

        <div class="field">
          <label for="climate">선호 날씨</label>
          <select id="climate" name="climate">
            <option value="any" selected>🌈 상관없음</option>
            <option value="warm">☀️ 따뜻한 곳</option>
            <option value="cool">❄️ 선선한 곳</option>
          </select>
        </div>

        <div class="field">
          <label for="days">여행 기간(일)</label>
          <input type="number" id="days" name="days" min="1" max="60" placeholder="예: 5" />
        </div>
      </div>

      <button type="submit" id="submit-btn" class="btn-primary">
        <span class="btn-label">여행지 추천받기</span>
      </button>
    </form>

    <section id="status" class="status" hidden></section>

    <section id="results" class="results" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <p>날씨: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · 항공권 가격은 거리 기반 <strong>추정값</strong>입니다.</p>
  </footer>

  <template id="card-template">
    <article class="card result-card">
      <div class="result-head">
        <div class="rank"></div>
        <div class="title-block">
          <h3 class="dest-name"></h3>
          <span class="dest-sub"></span>
        </div>
        <div class="match">
          <div class="match-ring"><span class="match-score"></span></div>
          <span class="match-label">매칭</span>
        </div>
      </div>
      <p class="blurb"></p>
      <div class="metrics">
        <div class="metric weather-metric">
          <span class="metric-emoji"></span>
          <div class="metric-body">
            <span class="metric-value weather-temp"></span>
            <span class="metric-desc weather-desc"></span>
          </div>
        </div>
        <div class="metric fare-metric">
          <span class="metric-emoji">✈️</span>
          <div class="metric-body">
            <span class="metric-value fare-price"></span>
            <span class="metric-desc fare-range"></span>
          </div>
        </div>
      </div>
      <ul class="reasons"></ul>
    </article>
  </template>

  <script src="/app.js"></script>
</body>
</html>
